name: roelyang_prototyp
description: "Roelyang Prototyp: tuner, playable instrument and guide for the Tibetan lute."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_soloud: ^5.2.2
  package_info_plus: ^10.2.2
  record: ^7.1.2
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
flutter_native_splash:
  color: "#0E1014"
  android: false
  ios: true
